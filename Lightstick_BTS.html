<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BTS ARMY BOMB V4 - Interactive 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(ellipse at 50% 30%,rgba(80,40,140,.3),transparent 50%),radial-gradient(ellipse at 50% 70%,rgba(40,20,80,.2),transparent 60%),#000}
#app{position:relative;width:100vw;height:100vh}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.top{position:absolute;top:4vh;width:100%;text-align:center;letter-spacing:.3em;text-shadow:0 0 20px rgba(160,100,255,.8);pointer-events:none}
.small{font:10px/1 monospace;opacity:.5;margin-bottom:8px;color:#c9a0ff}
.title{font-size:clamp(14px,2.5vw,22px);font-weight:300;color:#e0c0ff}
.bottom{position:absolute;bottom:7vh;width:100%;text-align:center;transition:opacity 1s;pointer-events:none}
.main{font-size:clamp(13px,2vw,18px);letter-spacing:.15em;opacity:.85;color:#d4b0ff}
.sub{margin-top:8px;font:10px/1 monospace;letter-spacing:.25em;opacity:.35;color:#a080d0;text-transform:uppercase}
.hint{position:absolute;bottom:14px;width:100%;text-align:center;color:rgba(200,180,255,.3);font:10px/1 monospace;letter-spacing:.15em;pointer-events:none}
.micwrap{position:absolute;top:8px;right:8px;z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mic{width:40px;height:40px;border-radius:50%;border:1px solid rgba(200,160,255,.5);background:rgba(40,20,80,.5);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:background .2s,border-color .2s}
#mic.on{border-color:#fff;background:rgba(140,80,255,.5)}
#micmsg{font:10px/1.4 monospace;letter-spacing:.08em;color:rgba(225,205,255,.85);max-width:220px;text-align:right;pointer-events:none;text-shadow:0 0 8px #000,0 0 3px #000;transition:opacity .6s}
</style>
</head>
<body>
<div id="app">
<canvas id="c"></canvas>
<div class="top"><div class="small">◆ ARMY BOMB ◆</div><div class="title">BTS LIGHTSTICK</div></div>
<div class="micwrap"><button id="mic" type="button" aria-label="Bật/tắt micro">🎤</button><div id="micmsg" style="opacity:0"></div></div>
<div class="bottom" id="msg"><div class="main">touch & drag to rotate 360°</div><div class="sub">💜 made with love 💜</div></div>
<div class="hint">TAP TO REDRAW · DRAG TO ROTATE · 🎤 CONCERT MODE</div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg');
const micBtn=document.getElementById('mic'),micMsg=document.getElementById('micmsg');
let W,H,D;
function resize(){
  D=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*D;cv.height=H*D;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(D,0,0,D,0,0);
}
resize();
addEventListener('resize',resize);

/* Quy ước: +Y = LÊN TRÊN trong mô hình 3D.
   Canvas có Y đi xuống nên khi chiếu phải TRỪ:  screenY = cy0 - y*scale */

/* ---------- Tương tác ---------- */
let rotY=-0.5,rotX=0.12;
let dragging=false,lastX=0,lastY=0,velY=0,velX=0,moved=0,lastMoveT=0;
let lastInteract=-99999,interacted=false;
let mode=0;                              // 0 tím · 1 cầu vồng · 2 trắng lạnh · 3 concert (theo mic)
const t0=performance.now();
let drawStart=t0;                        // mốc bắt đầu "vẽ" gậy
const sparkles=[];

cv.addEventListener('pointerdown',e=>{
  dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;velX=velY=0;
  lastInteract=performance.now();interacted=true;msg.style.opacity=0;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  moved+=Math.abs(dx)+Math.abs(dy);
  rotY+=dx*0.01;rotX+=dy*0.01;
  velY=dx*0.01;velX=dy*0.01;
  lastX=e.clientX;lastY=e.clientY;
  lastMoveT=lastInteract=performance.now();
});
function endDrag(){
  if(!dragging)return;
  dragging=false;
  if(moved<6){                           // chạm nhẹ = vẽ lại từ đầu (và đổi màu nếu không dùng mic)
    if(!micOn)mode=(mode+1)%3;
    drawStart=performance.now();
    sparkles.length=0;
  }
  if(performance.now()-lastMoveT>80){velX=velY=0}
  lastInteract=performance.now();
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);

/* =========================================================
   MICRO / CONCERT MODE
   - Nghe âm thanh qua micro (không phát lại ra loa nên không bị hú)
   - Có tiếng động đủ lớn hoặc có nhịp (trống, vỗ tay, hát) -> gậy chớp sáng + nhảy sang màu mới
   - Im lặng quá 4 giây -> màu dịu về tím
   ========================================================= */
let micOn=false,starting=false,audioCtx=null,analyser=null,micStream=null,tdata=null,fdata=null;
let micLevel=0,pulse=0,avgLevel=0.02,lastBeat=0,lastLoud=0;
let micHue=272,hueTarget=272,palIdx=0;
const PAL=[272,320,205,175,125,55,28,0,295];       // tím, hồng, xanh dương, cyan, xanh lá, vàng, cam, đỏ, tím hồng
let micMsgTimer=0;

function say(text,keep){
  micMsg.textContent=text;micMsg.style.opacity=text?1:0;
  clearTimeout(micMsgTimer);
  if(text&&!keep)micMsgTimer=setTimeout(()=>{micMsg.style.opacity=0},6000);
}
function setMicUI(){
  micBtn.classList.toggle('on',micOn);
  micBtn.textContent=micOn?'🎙️':'🎤';
  if(!micOn)micBtn.style.boxShadow='none';
}
async function startMic(){
  if(starting||micOn)return;
  starting=true;
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw {name:'NoSupport'};
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const AC=window.AudioContext||window.webkitAudioContext;
    audioCtx=new AC();
    if(audioCtx.state==='suspended')await audioCtx.resume();
    const src=audioCtx.createMediaStreamSource(micStream);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=1024;analyser.smoothingTimeConstant=0.5;
    src.connect(analyser);                        // KHÔNG nối ra loa
    tdata=new Uint8Array(analyser.fftSize);
    fdata=new Uint8Array(analyser.frequencyBinCount);
    micOn=true;mode=3;
    micHue=hueTarget=272;palIdx=0;avgLevel=0.02;lastBeat=lastLoud=performance.now();
    setMicUI();
    say('MIC ĐANG BẬT · hãy bật nhạc, vỗ tay hoặc hát!',false);
  }catch(err){
    const n=err&&err.name;
    let m='Không bật được micro.';
    if(n==='NotAllowedError'||n==='SecurityError')m='Micro đang bị chặn. Hãy cho phép micro cho trang này (nếu đang xem trong khung xem trước, hãy mở file bằng tab trình duyệt riêng).';
    else if(n==='NotFoundError'||n==='OverconstrainedError')m='Không tìm thấy micro trên thiết bị.';
    else if(n==='NoSupport')m='Trình duyệt chưa hỗ trợ micro, hoặc trang cần chạy qua https / localhost.';
    stopMic(true);
    say(m,false);
  }finally{starting=false}
}
function stopMic(silent){
  if(micStream)micStream.getTracks().forEach(t=>t.stop());
  if(audioCtx&&audioCtx.close)audioCtx.close();
  micStream=null;audioCtx=null;analyser=null;
  if(micOn||!silent)mode=0;
  micOn=false;pulse=0;micLevel=0;
  setMicUI();
  if(!silent)say('Đã tắt micro.',false);
}
micBtn.addEventListener('click',()=>{micOn?stopMic():startMic()});

function updateAudio(now,dt){
  if(!micOn||!analyser){micLevel*=0.9;pulse*=Math.pow(0.9,dt*60);return}
  analyser.getByteTimeDomainData(tdata);
  let sum=0;
  for(let i=0;i<tdata.length;i++){const v=(tdata[i]-128)/128;sum+=v*v}
  const rms=Math.sqrt(sum/tdata.length);
  analyser.getByteFrequencyData(fdata);
  let bass=0;
  for(let i=1;i<=8;i++)bass+=fdata[i];
  bass/=8*255;
  const e=Math.min(1,Math.max(rms*3.2,bass*1.1));            // độ lớn âm thanh 0..1
  micLevel+=(e-micLevel)*Math.min(1,dt*18);

  // nhịp: âm thanh vọt lên so với mức trung bình gần đây
  const beat=e>avgLevel*1.35+0.05&&e>0.10&&now-lastBeat>200;
  // không có nhịp rõ nhưng vẫn ồn (hát, nói to, nhạc đều): vẫn đổi màu định kỳ
  const steady=micLevel>0.14&&now-lastBeat>900;
  avgLevel+=(e-avgLevel)*Math.min(1,dt*(e>avgLevel?1.5:0.8));

  if(beat||steady){
    lastBeat=now;pulse=1;
    palIdx=(palIdx+1+(Math.random()<0.35?1:0))%PAL.length;
    hueTarget=PAL[palIdx];
    const n=6+Math.round(micLevel*14);
    for(let i=0;i<n;i++)addSparkle();
  }
  if(micLevel>0.08)lastLoud=now;
  if(now-lastLoud>4000){hueTarget=272;palIdx=0}             // im lặng -> về tím

  const diff=((hueTarget-micHue+540)%360)-180;               // đi đường ngắn nhất trên vòng màu
  micHue=(micHue+diff*Math.min(1,dt*10)+360)%360;
  pulse*=Math.pow(0.9,dt*60);

  micBtn.style.boxShadow=`0 0 ${6+micLevel*34}px hsla(${micHue|0},100%,65%,${0.4+micLevel*0.6})`;
}

/* ---------- Dựng hình: mọi thứ là các "nét" (polyline), mỗi nét có thời điểm được vẽ ra ---------- */
const V=[];
const SA=[],SB=[],ST=[],STH=[],SYY=[],SPH=[],SP=[],SI=[];
const PL=[];
let cur=null;
function addV(x,y,z){V.push(x,y,z);return V.length/3-1}
function beginPoly(delay,dur,speed,tail){
  const ph=Math.random();
  cur={s0:SA.length,n:0,delay:delay,dur:dur,speed:speed,tail:tail,
       dir:Math.random()<0.5?1:-1,u:ph,flare:true};
  PL.push(cur);
  return cur;
}
function addSeg(a,b,type,th,y){
  SA.push(a);SB.push(b);ST.push(type);STH.push(th);SYY.push(y);SPH.push(Math.random()*6.283);
  SP.push(PL.length-1);SI.push(cur.n++);
}

/* Loại nét: 0 = vành bạc · 1 = cổ · 2 = tay cầm · 3 = quả cầu · 4 = logo · 5 = nút bấm */
const CY=2.3,R=1.1;
const YC=0.6;
const PI2=Math.PI*2;
const rnd=()=>Math.random();

function ring(y,r,seg,type){
  beginPoly(0.2+((y+2.3)/5.8)*2.4+rnd()*0.15,1.0,0.10+rnd()*0.18,0.35);
  const ids=[];
  for(let k=0;k<seg;k++){const th=k/seg*PI2;ids.push(addV(Math.cos(th)*r,y,Math.sin(th)*r))}
  for(let k=0;k<seg;k++)addSeg(ids[k],ids[(k+1)%seg],type,(k+0.5)/seg*PI2,y);
  return ids;
}
function densify(p,step){
  const o=[p[0]];
  for(let j=1;j<p.length;j++){
    const y0=p[j-1][0],r0=p[j-1][1],y1=p[j][0],r1=p[j][1];
    const n=Math.max(1,Math.ceil(Math.hypot(y1-y0,r1-r0)/step));
    for(let s=1;s<=n;s++){const u=s/n;o.push([y0+(y1-y0)*u,r0+(r1-r0)*u])}
  }
  return o;
}
const matOf=y=>y>1.18?0:y>0.72?1:y>-1.92?2:y>-2.12?0:1;

const collarIds=[],globeIds=[],logoIds=[];

// 1) THÂN
const bodyProf=[
  [1.52,0.76],[1.52,0.84],[1.44,0.86],[1.36,0.80],[1.28,0.64],[1.20,0.52],
  [1.10,0.44],[0.95,0.41],[0.86,0.44],[0.78,0.44],[0.74,0.38],
  [0.70,0.37],[0.20,0.355],[-0.80,0.33],[-1.60,0.30],[-1.90,0.31],
  [-1.95,0.35],[-2.05,0.35],[-2.10,0.32],
  [-2.18,0.28],[-2.22,0.15],[-2.22,0]
];
const bp=densify(bodyProf,0.2);
for(const p of bp){
  if(p[1]<0.02)continue;
  const ids=ring(p[0],p[1],30,matOf(p[0]));
  if(p[0]>1.2)for(const id of ids)collarIds.push(id);
}
const MB=14;
for(let k=0;k<MB;k++){
  beginPoly(1.2+rnd()*0.8,1.8,0.18+rnd()*0.2,0.3);
  const th=k/MB*PI2,c=Math.cos(th),s=Math.sin(th);
  const ids=bp.map(p=>addV(c*p[1],p[0],s*p[1]));
  for(let j=0;j<ids.length-1;j++)addSeg(ids[j],ids[j+1],matOf((bp[j][0]+bp[j+1][0])/2),th,(bp[j][0]+bp[j+1][0])/2);
}

// 2) QUẢ CẦU
for(let j=1;j<12;j++){
  const p=Math.PI*j/12;
  const ids=ring(CY+R*Math.cos(p),R*Math.sin(p),40,3);
  for(const id of ids)globeIds.push(id);
}
const MG=20,MGS=24;
for(let k=0;k<MG;k++){
  beginPoly(2.0+rnd()*0.8,1.8,0.2+rnd()*0.22,0.3);
  const th=k/MG*PI2,c=Math.cos(th),s=Math.sin(th);
  const ids=[];
  for(let j=0;j<=MGS;j++){
    const p=Math.PI*j/MGS;
    ids.push(addV(c*R*Math.sin(p),CY+R*Math.cos(p),s*R*Math.sin(p)));
  }
  for(let j=0;j<MGS;j++){
    const p=Math.PI*(j+0.5)/MGS;
    addSeg(ids[j],ids[j+1],3,th,CY+R*Math.cos(p));
  }
  for(let j=1;j<MGS;j++)globeIds.push(ids[j]);
}

// 3) LOGO BTS (xấp xỉ) – chỉnh toạ độ [x,y] tại đây nếu muốn giống hơn
const LOGO=[
  [[-0.58,-0.50],[-0.09,-0.50],[-0.09,0.58],[-0.58,0.22]],
  [[ 0.09,-0.50],[ 0.58,-0.50],[ 0.58,0.22],[ 0.09,0.58]]
];
function outline(pts,z,type,delay,dur){
  beginPoly(delay,dur,0.35,0.45);
  const ids=pts.map(p=>addV(p[0],CY+p[1],z));
  for(let k=0;k<ids.length;k++)addSeg(ids[k],ids[(k+1)%ids.length],type,0,CY);
  return ids;
}
for(const q of LOGO){
  for(const id of outline(q,0.62,4,3.4,1.0))logoIds.push(id);
  const cx=q.reduce((s,p)=>s+p[0],0)/q.length,cyy=q.reduce((s,p)=>s+p[1],0)/q.length;
  outline(q.map(p=>[cx+(p[0]-cx)*0.62,cyy+(p[1]-cyy)*0.62]),0.62,4,3.9,0.8);
}

// 4) NÚT BẤM
(function(){
  beginPoly(2.2,0.6,0.4,0.5);
  cur.flare=false;
  const by=0.30,br=0.36,ids=[],n=16;
  for(let i=0;i<n;i++){
    const a=i/n*PI2,px=0.09*Math.cos(a),py=by+0.07*Math.sin(a);
    ids.push(addV(px,py,Math.sqrt(br*br-px*px)+0.012));
  }
  for(let i=0;i<n;i++)addSeg(ids[i],ids[(i+1)%n],5,0,by);
})();

const nV=V.length/3,nS=SA.length,nP=PL.length;
const TZ=new Float32Array(nV),SX=new Float32Array(nV),SY=new Float32Array(nV);
const PF=new Float32Array(nP),PS=new Float32Array(nP),PU=new Float32Array(nP);

const stars=[];
function pickStars(pool,n,k){
  for(let i=0;i<n;i++)stars.push({id:pool[(rnd()*pool.length)|0],ph:rnd()*PI2,sp:1.5+rnd()*3.5,k:k});
}
pickStars(globeIds,70,1);
pickStars(collarIds,16,0.8);
pickStars(logoIds,8,1.3);

/* ---------- Màu ---------- */
function hsl2rgb(h,s,l){
  h/=30;s/=100;l/=100;
  const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};
  return [f(0),f(8),f(4)];
}
function globalHue(t){return mode===0?272:mode===1?(t*45)%360:mode===2?215:micHue}
function globalSat(){return mode===2?30:95}

/* ---------- Hạt lấp lánh bay quanh ---------- */
function addSparkle(){
  if(sparkles.length>=(micOn?160:80))return;
  const a=rnd()*PI2,rad=R*(0.85+rnd()*0.8);
  sparkles.push({
    x:Math.cos(a)*rad,y:CY+(rnd()-0.5)*2.6,z:Math.sin(a)*rad,
    life:1,size:rnd()*2+1,hueOff:rnd()*80-40,
    vx:(rnd()-0.5)*0.012,vy:(rnd()-0.5)*0.012+0.004,vz:(rnd()-0.5)*0.012,
    phase:rnd()*PI2
  });
}

/* ---------- Quay & chiếu ---------- */
let c1,s1,c2,s2,rx,ry,rz;
function rot(x,y,z){
  const x1=x*c1-z*s1,z1=x*s1+z*c1;
  rx=x1;ry=y*c2-z1*s2;rz=y*s2+z1*c2;
}
const DIST=12;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function glowDot(px,py,size,alpha,hue,sat){
  ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(px,py,0,px,py,size*2.4);
  g.addColorStop(0,`hsla(${hue},${Math.min(sat,50)}%,96%,${alpha})`);
  g.addColorStop(0.35,`hsla(${hue},${sat}%,72%,${alpha*0.55})`);
  g.addColorStop(1,`hsla(${hue},${sat}%,55%,0)`);
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(px,py,size*2.4,0,PI2);ctx.fill();
}
function flare(px,py,size,alpha,hue,sat){
  glowDot(px,py,size,alpha,hue,sat);
  ctx.strokeStyle=`hsla(${hue},${Math.min(sat,60)}%,96%,${alpha})`;
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(px-size*1.9,py);ctx.lineTo(px+size*1.9,py);
  ctx.moveTo(px,py-size*1.9);ctx.lineTo(px,py+size*1.9);
  ctx.stroke();
  ctx.strokeStyle=`hsla(${hue},${Math.min(sat,60)}%,96%,${alpha*0.55})`;
  ctx.lineWidth=0.7;
  ctx.beginPath();
  const d=size*0.95;
  ctx.moveTo(px-d,py-d);ctx.lineTo(px+d,py+d);
  ctx.moveTo(px-d,py+d);ctx.lineTo(px+d,py-d);
  ctx.stroke();
}

/* ---------- Vòng lặp vẽ ---------- */
let lastNow=-1;
function frame(now){
  if(lastNow<0)lastNow=now;
  const dt=clamp((now-lastNow)/1000,0.001,0.05);
  lastNow=now;
  const t=(now-t0)/1000;
  const tt=Math.max(0,(now-drawStart)/1000);

  updateAudio(now,dt);
  const speedK=1+(micOn?micLevel*3+pulse*2:0);          // nhạc càng to tia sáng càng chạy nhanh

  if(!dragging){
    rotY+=velY;rotX+=velX;velY*=0.94;velX*=0.94;
    if(now-lastInteract>2500){rotY+=0.004;rotX+=(0.12-rotX)*0.02}
  }
  rotX=clamp(rotX,-1.3,1.3);

  c1=Math.cos(rotY);s1=Math.sin(rotY);c2=Math.cos(rotX);s2=Math.sin(rotX);
  const sc=Math.min(W*0.2,H*0.125),cx0=W/2,cy0=H*0.52;

  for(let i=0;i<nV;i++){
    rot(V[i*3],V[i*3+1]-YC,V[i*3+2]);
    TZ[i]=rz;
    const q=DIST/(DIST-rz);
    SX[i]=cx0+rx*sc*q;
    SY[i]=cy0-ry*sc*q;
  }

  rot(0,CY-YC,0);
  const gq=DIST/(DIST-rz),gx=cx0+rx*sc*gq,gy=cy0-ry*sc*gq,gR=R*sc*gq;

  const gh=globalHue(t),gs=globalSat();
  const lc=hsl2rgb(gh,gs,62),lr=lc[0],lg=lc[1],lb=lc[2];
  const mix=(k)=>[(255+(lr-255)*k)|0,(255+(lg-255)*k)|0,(255+(lb-255)*k)|0];
  const bodyCol=[mix(0.25),mix(0.55),mix(0.7)];

  for(let p=0;p<nP;p++){
    const P=PL[p];
    const f=clamp((tt-P.delay)/P.dur,0,1);
    PF[p]=0.5-0.5*Math.cos(Math.PI*f);
    PS[p]=clamp((tt-P.delay-P.dur)/1.5,0,1);
    P.u+=dt*P.speed*P.dir*speedK;
    PU[p]=((P.u%1)+1)%1;
  }

  ctx.clearRect(0,0,W,H);
  ctx.lineCap='round';ctx.lineJoin='round';

  // quầng sáng (phồng lên và sáng hơn theo nhịp)
  const glowK=clamp(tt/5,0,1);
  ctx.globalCompositeOperation='lighter';
  let g=ctx.createRadialGradient(gx,gy,0,gx,gy,gR*3.2*(1+0.3*pulse));
  g.addColorStop(0,`rgba(${lr},${lg},${lb},${(0.26+0.35*pulse)*glowK})`);
  g.addColorStop(0.5,`rgba(${lr},${lg},${lb},${(0.07+0.15*pulse)*glowK})`);
  g.addColorStop(1,`rgba(${lr},${lg},${lb},0)`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(micOn){                                               // lõi sáng của quả cầu chớp theo nhạc
    const core=(0.06+0.5*pulse+0.25*micLevel)*glowK;
    g=ctx.createRadialGradient(gx,gy,0,gx,gy,gR*1.2);
    g.addColorStop(0,`rgba(255,255,255,${core*0.8})`);
    g.addColorStop(0.5,`rgba(${lr},${lg},${lb},${core*0.7})`);
    g.addColorStop(1,`rgba(${lr},${lg},${lb},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(gx,gy,gR*1.2,0,PI2);ctx.fill();
  }

  const boost=micOn?pulse*0.55:0;
  const spread=micOn?14+55*micLevel:30;                    // nhạc càng to màu trên quả cầu càng loang nhiều sắc

  // ===== các nét: đang được vẽ ra + tia sáng chạy liên tục =====
  for(let i=0;i<nS;i++){
    const p=SP[i],P=PL[p];
    let amt=PF[p]*P.n-SI[i];
    if(amt<=0)continue;
    if(amt>1)amt=1;
    const a=SA[i],b=SB[i],type=ST[i];

    const s=(SI[i]+0.5)/P.n;
    let d=P.dir>0?PU[p]-s:s-PU[p];
    d-=Math.floor(d);
    const I=d<P.tail?Math.pow(1-d/P.tail,1.6):0;
    const settle=PS[p];
    const energy=Math.min(1,I*settle+(1-settle)*0.95+boost);

    const z=(TZ[a]+TZ[b])*0.5;
    const depth=clamp(0.62+z*0.22,0.22,1);
    const shimmer=0.8+0.2*Math.sin(t*3.5+SPH[i]);
    const al=clamp(depth*(0.30*shimmer+0.70*energy),0,1);

    let col,wCore,wGlow;
    if(type===3){
      let hue,L;
      if(mode===0){hue=272+30*Math.sin(STH[i]*2+SYY[i]*1.6+t*0.8);L=66+26*energy}
      else if(mode===1){hue=(STH[i]*57.3+SYY[i]*40+t*45)%360;L=62+28*energy}
      else if(mode===2){hue=215+12*Math.sin(STH[i]*2+SYY[i]+t);L=80+16*energy}
      else{hue=micHue+spread*Math.sin(STH[i]*2+SYY[i]*1.6+t*1.5);L=64+28*energy}
      hue=((hue%360)+360)%360;
      col=`hsla(${hue|0},${gs}%,${L|0}%,${al.toFixed(3)})`;
      wCore=1.2+1.1*energy;wGlow=4+2*energy;
    }else if(type===4){
      col=`rgba(255,255,255,${al.toFixed(3)})`;
      wCore=1.6+1.0*energy;wGlow=8;
    }else if(type===5){
      col=`rgba(255,160,205,${al.toFixed(3)})`;
      wCore=1.2;wGlow=3.5;
    }else{
      const c=bodyCol[type],w=energy*0.7;
      col=`rgba(${(c[0]+(255-c[0])*w)|0},${(c[1]+(255-c[1])*w)|0},${(c[2]+(255-c[2])*w)|0},${al.toFixed(3)})`;
      wCore=1.1+1.1*energy;wGlow=3.5+2*energy;
    }

    const x1=SX[a],y1=SY[a];
    const x2=amt<1?x1+(SX[b]-x1)*amt:SX[b];
    const y2=amt<1?y1+(SY[b]-y1)*amt:SY[b];
    ctx.globalCompositeOperation='lighter';
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
    if(energy>0.25){
      ctx.strokeStyle=col;ctx.globalAlpha=0.18;ctx.lineWidth=wGlow;ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.strokeStyle=col;ctx.lineWidth=wCore;ctx.stroke();
  }
  ctx.globalAlpha=1;

  // ===== đầu bút / tia sáng =====
  for(let p=0;p<nP;p++){
    const P=PL[p];
    const hue=mode===1?(gh+p*17)%360:gh;
    if(PF[p]>0.001&&PF[p]<0.999){
      const pos=PF[p]*P.n,idx=Math.min(P.n-1,Math.floor(pos)),fr=pos-idx,sg=P.s0+idx;
      const a=SA[sg],b=SB[sg];
      const px=SX[a]+(SX[b]-SX[a])*fr,py=SY[a]+(SY[b]-SY[a])*fr;
      const df=clamp(0.6+TZ[a]*0.25,0.3,1);
      flare(px,py,4.5,df,hue,gs);
    }else if(PS[p]>0.4&&P.flare){
      const u=PU[p],idx=Math.min(P.n-1,Math.floor(u*P.n)),fr=u*P.n-idx,sg=P.s0+idx;
      const a=SA[sg],b=SB[sg];
      const px=SX[a]+(SX[b]-SX[a])*fr,py=SY[a]+(SY[b]-SY[a])*fr;
      const df=clamp(0.55+TZ[a]*0.25,0.2,1);
      glowDot(px,py,2.6+2*boost,Math.min(1,0.85*df*PS[p]),hue,gs);
    }
  }

  // ===== sao lấp lánh (nhiều và rực hơn khi có nhịp) =====
  const starK=clamp((tt-3.5)/1.2,0,1);
  if(starK>0){
    for(let i=0;i<stars.length;i++){
      const s=stars[i];
      let tw=Math.pow(0.5+0.5*Math.sin(t*s.sp+s.ph),10);
      if(micOn&&pulse>0.25)tw=Math.max(tw,pulse*(0.35+0.65*((i*37)%10)/10));
      if(tw<0.06)continue;
      const df=clamp(0.55+TZ[s.id]*0.25,0.2,1);
      flare(SX[s.id],SY[s.id],(2.5+9*tw)*s.k,tw*df*starK,mode===1?(gh+i*13)%360:gh,gs);
    }
  }

  // ===== hạt lấp lánh bay =====
  if(tt>2){
    if(rnd()<0.5)addSparkle();
    if(micOn)for(let k=0;k<micLevel*4;k++)if(rnd()<0.6)addSparkle();
  }
  for(let i=sparkles.length-1;i>=0;i--){
    const s=sparkles[i];
    s.life-=0.012;s.x+=s.vx;s.y+=s.vy;s.z+=s.vz;s.phase+=0.1;
    if(s.life<=0){sparkles.splice(i,1);continue}
    rot(s.x,s.y-YC,s.z);
    const q=DIST/(DIST-rz);
    const alpha=s.life*(0.5+0.5*Math.sin(s.phase));
    const size=s.size*(0.8+0.2*Math.sin(s.phase));
    flare(cx0+rx*sc*q,cy0-ry*sc*q,size*1.1,alpha,(gh+s.hueOff+360)%360,gs);
  }

  ctx.globalCompositeOperation='source-over';
  if(tt>6&&!interacted)msg.style.opacity=0.8;
  requestAnimationFrame(frame);
}
msg.style.opacity=0;
requestAnimationFrame(frame);
</script>
